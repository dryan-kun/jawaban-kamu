<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu ❤️</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Comic Sans MS', cursive;
  background: linear-gradient(135deg, #ff9ecf, #ffc1e3);
  overflow: hidden;
  text-align: center;
  color: white;
}

.slide {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: fadeIn 1s ease;
}

h1 {
  font-size: 2em;
  margin-bottom: 20px;
}

button {
  padding: 12px 25px;
  margin: 10px;
  border: none;
  border-radius: 25px;
  background: white;
  color: #ff4fa3;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
  background: #ffe6f2;
}

@keyframes fadeIn {
  from {opacity: 0; transform: translate(-50%, -40%);}
  to {opacity: 1; transform: translate(-50%, -50%);}
}

.heart {
  position: fixed;
  top: -10px;
  animation: fall linear forwards;
  color: pink;
}

@keyframes fall {
  to { transform: translateY(110vh); opacity: 0; }
}

.bear {
  position: fixed;
  bottom: 0;
  right: 15px;
  width: 180px;      /* ukuran utama */
  max-width: 40vw;   /* biar ga kegedean di HP kecil */
  pointer-events: none; /* biar ga nutup tombol */
}

@keyframes bearDance {
  from { transform: translateY(0px) rotate(-5deg); }
  to { transform: translateY(-15px) rotate(5deg); }
}
</style>
</head>

<body>

<div class="slide">
  <h1 id="text">Selamat datang cintakuu ❤️</h1>
  <div id="buttons">
    <button onclick="next()">Next</button>
  </div>
</div>

<script>
let step = 0;
let responses = [];

function next(answerText = null) {
  if (answerText) responses.push(answerText);
  step++;

  const text = document.getElementById("text");
  const buttons = document.getElementById("buttons");

  if (step === 1) {
    text.innerHTML = "Aku minta maaf yaa";
    buttons.innerHTML = `
      <button onclick="next('Maaf: Iyaa')">Iyaa</button>
      <button onclick="next('Maaf: Engga')">Engga</button>`;
  }
  else if (step === 2) {
    text.innerHTML = "Aku sayang sama kamu, kamu sayang aku ngga?";
    buttons.innerHTML = `
      <button onclick="next('Sayang: Iya')">Iya</button>
      <button onclick="next('Sayang: Engga')">Engga</button>`;
  }
  else if (step === 3) {
    text.innerHTML = "Aku sangat cinta sama kamu, kamu cinta aku ngga?";
    buttons.innerHTML = `
      <button onclick="next('Cinta: Aku cinta')">Aku cinta</button>
      <button onclick="next('Cinta: G')">G</button>`;
  }
  else if (step === 4) {
    text.innerHTML = "Mau cintai aku sekali lagi?";
    buttons.innerHTML = `
      <button onclick="next('Cintai lagi: Mau')">Mau</button>
      <button onclick="next('Cintai lagi: Tidak')">Tidak</button>`;
  }
  else if (step === 5) {
    text.innerHTML = "Kamu masih mau sama aku?";
    buttons.innerHTML = `
      <button onclick="next('Masih mau: Mau')">Mau</button>
      <button onclick="next('Masih mau: Engga')">Engga</button>`;
  }
  else if (step === 6) {
    text.innerHTML = "Udah yakin dengan semua itu?";
    buttons.innerHTML = `
      <button onclick="next('Yakin: Iya banget')">Iyaa aku sangat yakin sayangg</button>`;
  }
  else {
    text.innerHTML = "Terimakasih telah menjawab ❤️";
    buttons.innerHTML = "";
    showBear();
    sendEmail();
  }
}

function sendEmail() {
  emailjs.init("62lI_6oEr5dhQw33V");

  emailjs.send("service_utzn7ua", "template_p4wklzb", {
    message: responses.join("\n")
  })
  .then(() => console.log("Email terkirim"))
  .catch(err => console.log("Email gagal:", err));
}

function showBear() {
  const bear = document.createElement("img");
  bear.src = "bear.gif";
  bear.className = "bear";
  document.body.appendChild(bear);
}

setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💗";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 20 + 15) + "px";
  heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 6000);
}, 500);
</script>
<img src="bear.gif" class="bear">
}
</body>
</html>
